# /etc/sslh.cfg

inetd: false;
numeric: true;
transparent: false;
timeout: 2;
user: "nobody";
pidfile: "/var/run/sslh.pid";

verbose-config: 0; #  print configuration at startup
verbose-config-error: 4;  # print configuration errors
verbose-connections: 4; # trace established incoming address to forward address
verbose-connections-error: 4; # connection errors
verbose-connections-try: 4; # connection attempts towards targets
verbose-fd: 0; # file descriptor activity, open/close/whatnot
verbose-packets: 0; # hexdump packets on which probing is done
verbose-probe-info: 0; # what's happening during the probe process
verbose-probe-error: 4; # failures and problems during probing
verbose-system-error: 4; # system call problem, i.e.  malloc, fork, failing
verbose-int-error: 0; # internal errors, the kind that should never happen

logfile: "/var/log/sslh.log";

listen:
(
  { host: "0.0.0.0"; port: "8443"; max_connections: 200; },
  { host: "[::]"; port: "8443"; max_connections: 200; }
);

protocols:
(
  { name: "regex"; service: "httpd"; host: "0.0.0.0"; port: "8080"; max_connections: 20;
    regex_patterns:
    [ "^(GET|POST|PUT|OPTIONS|DELETE|HEADER) [^ ]* HTTP/[0-9.]*[\r\n]*Host: mysite.myhost.server1.test" ];
    minlength: 16; log_level: 1;
  },
  { name: "ssh"; service: "dropbear"; host: "0.0.0.0"; port: "2222"; max_connections: 80;
    keepalive: true; fork: false; log_level: 3;
  },
  { name: "tls"; service: "xmpp"; host: "0.0.0.0"; port: "5222"; max_connections: 40;
    alpn_protocols: [ "xmpp-client" ]; sni_hostnames: [ "im.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "dropbear"; host: "0.0.0.0"; port: "2443"; max_connections: 60;
    sni_hostnames: [ "ssh.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "ircd"; host: "0.0.0.0"; port: "6697"; max_connections: 40;
    sni_hostnames: [ "irc.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "ssl"; host: "0.0.0.0"; port: "4443"; max_connections: 10;
    sni_hostnames: [ "mysite.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "webdav"; host: "0.0.0.0"; port: "4081"; max_connections: 40;
    keepalive: true; sni_hostnames: [ "webdav.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "rsyncd"; host: "0.0.0.0"; port: "1874"; max_connections: 40;
    keepalive: true; sni_hostnames: [ "rsync.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "git"; host: "0.0.0.0"; port: "9443"; max_connections: 40;
    keepalive: true; sni_hostnames: [ "git.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "catbin"; host: "0.0.0.0"; port: "5656"; max_connections: 4;
    sni_hostnames: [ "paste.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "vnc"; host: "0.0.0.0"; port: "5901"; max_connections: 4;
    sni_hostnames: [ "vnc.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "bt-tracker"; host: "0.0.0.0"; port: "9696"; max_connections: 4;
    sni_hostnames: [ "bt.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "socks"; host: "0.0.0.0"; port: "6060"; max_connections: 4;
    sni_hostnames: [ "ss.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "socks"; host: "0.0.0.0"; port: "1080"; max_connections: 4;
    sni_hostnames: [ "ss2.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "socks"; host: "0.0.0.0"; port: "3443"; max_connections: 4;
    sni_hostnames: [ "ss3.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "proxy"; host: "0.0.0.0"; port: "8008"; max_connections: 4;
    sni_hostnames: [ "pp.myhost.server1.test" ]; log_level: 2;
  },
  { name: "tls"; service: "proxy"; host: "0.0.0.0"; port: "8010"; max_connections: 4;
    sni_hostnames: [ "pp2.myhost.server1.test" ]; log_level: 2;
  },
  { name: "regex"; service: "webdav"; host: "0.0.0.0"; port: "4080"; max_connections: 40;
    regex_patterns:
    [ "^(GET|POST|PUT|OPTIONS|DELETE|HEADER) [^ ]* HTTP/[0-9.]*[\r\n]*Host: webdav.myhost.server1.test" ];
    keepalive: true; minlength: 16; log_level: 1;
  },
  { name: "regex"; service: "catbin"; host: "0.0.0.0"; port: "5454"; max_connections: 40;
    regex_patterns:
    [ "^(GET|POST|PUT|OPTIONS|DELETE|HEADER) [^ ]* HTTP/[0-9.]*[\r\n]*Host: paste.myhost.server1.test" ];
    keepalive: true; minlength: 16; log_level: 1;
  },
  { name: "regex"; service: "bt-tracker"; host: "0.0.0.0"; port: "6969"; max_connections: 40;
    regex_patterns:
    [ "^(GET|POST|PUT|OPTIONS|DELETE|HEADER) [^ ]* HTTP/[0-9.]*[\r\n]*Host: bt.myhost.server1.test" ];
    keepalive: true; minlength: 16; log_level: 1;
  },
  { name: "regex"; service: "git"; host: "0.0.0.0"; port: "9418"; max_connections: 40;
    regex_patterns:
    [ "^(GET|POST|PUT|OPTIONS|DELETE|HEADER) [^ ]* HTTP/[0-9.]*[\r\n]*Host: git.myhost.server1.test" ];
    keepalive: true; minlength: 16; log_level: 1;
  },
  { name: "regex"; service: "httpd"; host: "0.0.0.0"; port: "8181"; max_connections: 25;
    regex_patterns:
    [ "^(GET|POST|PUT|OPTIONS|DELETE|HEADER) [^ ]* HTTP/[0-9.]*[\r\n]*Host: support.myhost.server1.test" ];
    minlength: 16; log_level: 1;
  },
  { name: "regex"; host: "0.0.0.0"; port: "5222"; max_connections: 20;
    regex_patterns: [ "jabber" ]; minlength: 60;  # regex - if we don't have that many bytes
  },
  { name: "http"; host: "0.0.0.0"; port: "8484"; max_connections: 60; keepalive: true; log_level: 1; }
  # Blackhole service against DDoS attack
  { name: "anyprot"; host: "0.0.0.0"; port: "8484"; max_connections: 80; keepalive: true; log_level: 1; }
  #{ name: "timeout"; service: "dropbear"; host: "0.0.0.0"; port: "8484"; max_connections: 80; log_level: 1; }
);

#on-timeout: "timeout";
