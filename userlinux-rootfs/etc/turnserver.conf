#listening-port=3478
#tls-listening-port=5349

#min-port=49152
#max-port=65535

#verbose
#Verbose

#no-auth

#cert=/etc/ssl/uacme/<myhost>/cert.pem
#pkey=/etc/ssl/uacme/private/<myhost>/key.pem
log-file=/var/log/turnserver.log
simple-log

no-software-attribute
no-multicast-peers
pidfile="/var/run/turnserver.pid"

allocation-default-address-family="ipv4"

web-admin
web-admin-ip=127.0.0.1
web-admin-port=4040

no-rfc5780
response-origin-only-with-rfc5780
