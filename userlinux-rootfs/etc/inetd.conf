##############################################################################
#  SSH PORT: UserLAnd 2222 / Termux 2022 or another port...                  #
##############################################################################
#<[ip:]port/nameserv> <sock_type> <proto> <flags> <user> <server_path> <args>#

2121 stream tcp nowait.20 root /usr/local/sbin/tcpd /usr/sbin/ftpd -S -A -t20 /srv/ftp/anyhost/

127.0.0.1:8181 stream tcp nowait.40 root /usr/sbin/httpd httpd -i -h /var/www/anyhost/ -c /etc/httpd-anyhost.conf

#127.0.0.1:1873 stream tcp nowait.10 root /usr/local/sbin/tcpd /usr/bin/rsync --daemon -M daemonchroot=/srv/rsync/anyhost --config=/etc/rsync/rsyncd-pub.conf

git stream tcp nowait.20 nobody /usr/local/sbin/tcpd /usr/bin/git daemon --inetd --export-all --interpolated-path=/srv/git/%H%D /srv/git

127.0.0.1:7080 stream tcp nowait.60 3proxy /usr/bin/socks socks -d -4 -I

127.0.0.1:5655 stream tcp nowait.20 root /bin/sh sh -l  # to: 127.0.0.1:5655

2022 stream tcp nowait.20 root /usr/local/sbin/tcpd /usr/sbin/dropbear -i -r /etc/dropbear/dropbear_ed25519_host_key -s -j -k -T 4

127.0.0.1:2222 stream tcp nowait.20 root /usr/sbin/dropbear dropbear -i -r /etc/dropbear/dropbear_ed25519_host_key -s -j -k -T 8

5000 stream tcp nowait.1 nobody /usr/local/sbin/tcpd /usr/sbin/nuttcp -4 -S -1 --idle-data-timeout 60/120/240

#9999 stream tcp nowait.10 root /usr/local/sbin/tcpd /usr/local/bin/redir -i -m 16384 -I catbin 127.0.0.1:9998

#8443 stream tcp nowait.40 root /usr/local/sbin/tcpd /usr/sbin/sslh -i --http=0.0.0.0:8080 --ssl=0.0.0.0:4443 --ssh=0.0.0.0:2222 --anyprot=0.0.0.0:4443
