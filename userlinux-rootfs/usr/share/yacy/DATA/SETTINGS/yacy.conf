# /var/lib/yacy/SETTINGS/yacy.conf

locale.language=en
javastart_Xmx=Xmx800m
crawler.MaxSameHostInQueue=5
search.verify=cacheonly
http.outgoing.pool.general.maxTotal=20
http.outgoing.pool.remoteSolr.maxTotal = 10
port=8090
proxyStoreHTCache=true
resource.disk.free.min.steadystate=700
#pkcs12ImportFile=DATA/SETTINGS/keystore.pkcs12
#pkcs12ImportPwd=passwordforyacysconfig
crawlingDomMaxPages=2000
proxyIndexingRemote=true
proxyURL.rewriteURLs=all
crawler.MaxActiveThreads=10
crawlPause.localsearch=5000
crawlPause.proxy=1000
httpdMaxBusySessions=10
crawlingDepth=2
#port.ssl=8091
dataRoot=/usr/share/yacy
crawlingCountryMustMatch=US,GB
proxyURL=true
autocrawl.deep.depth=2
javastart_priority=10
proxyCacheSize=150
performanceIO=10
upnp.enabled=false
#network.unit.protocol.https.preferred=true
# EOF