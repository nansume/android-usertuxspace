# 127.0.0.1:853 stream tcp nowait.20 nobody /usr/bin/stunnel stunnel /etc/stunnel/stunnel-dnstls.conf
# dns-server via ssl (server-mode)  dnsmasq[2053] --> DoT[853] client
[dns-over-tls]
connect = 0.0.0.0:2053
accept = 127.0.0.1:853

cert = /etc/ssl/uacme/<myhost>/cert.pem
key = /etc/ssl/uacme/private/<myhost>/key.pem
